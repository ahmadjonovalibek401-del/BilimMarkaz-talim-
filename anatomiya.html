<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nerv sistemasi - jonli slaydlar</title>
<style>
:root{--bg:#f4f9fc;--tx:#1c2a3a;--card:#fff;--nav:#14305c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b2d;--tx:#e8f0f8;--card:#1a2b45}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;overflow:hidden}
.s{display:none;height:100%;padding:14px 18px 70px;overflow:auto;animation:in .5s}.s.on{display:block}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1}}
h1{margin:0 0 8px;font-size:26px;color:#fff;background:linear-gradient(90deg,#1aa6b7,#e8557a);padding:12px 16px;border-radius:14px}
.w{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.w>*{flex:1 1 300px}
svg{width:100%;max-height:52vh;background:var(--card);border-radius:14px}
li{margin:8px 0;font-size:16px;line-height:1.35}
nav{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--nav)}
nav button{border:0;border-radius:20px;padding:10px 18px;font-size:16px;font-weight:700;background:#ffd23f;color:#14305c}
nav span{flex:1;text-align:center;color:#fff;font-weight:700}
.p{animation:pl 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pl{50%{transform:scale(1.15)}}
.hb{animation:pl var(--d,.5s) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fd{animation:fd 3s infinite}@keyframes fd{50%{opacity:.15}}
.dr{animation:dr 2s linear infinite}@keyframes dr{from{transform:translateY(-10px);opacity:1}to{transform:translateY(40px);opacity:0}}
</style></head><body>
<div id="app"></div>
<nav><button onclick="go(-1)">◀</button><span id="ct"></span><button onclick="go(1)">▶</button></nav>
<script>
const P='#e8557a',T='#1aa6b7',O='#ff8a3d',G='#4cb963',Y='#ffd23f',N='#14305c';
const sig=(id,d,col=Y,r=7,b=0)=>`<circle r="${r}" fill="${col}" stroke="${N}" stroke-width="1.5"><animateMotion dur="${d}s" begin="${b}s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>`;
const neu=(x,y,col=P,id='a')=>`<g stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round"><path d="M${x} ${y}l-50-35l-25-10M${x} ${y}l-55 5l-25 25M${x} ${y}l-30 45l-10 25M${x} ${y}l0-55l15-25"/><path id="${id}" d="M${x} ${y}H${x+220}"/></g><circle class="p" cx="${x}" cy="${y}" r="24" fill="${Y}" stroke="${col}" stroke-width="4"/><circle cx="${x}" cy="${y}" r="9" fill="${col}"/>`;
const S=[
["NERV SISTEMASI","Topografik anatomiya · 1-bo'lim",["Kirish, neyronlar, MNS, PNS","Avtonom nerv sistemasi","Siljitib ko'ring: ◀ ▶ yoki suring"],
`<svg viewBox="0 0 400 260"><path id="t" d="M120 130C180 60 260 200 340 120" stroke="${T}" stroke-width="4" fill="none"/>${neu(110,130,P,'ax0')}${sig('t',3,Y,8)}${sig('t',3,O,8,1.5)}</svg>`],
["I. Nerv sistemasi","",["MNS = bosh miya + orqa miya","PNS = 12 juft kranial + 31 juft spinal nerv + gangliylar","Somatik: ixtiyoriy harakat; Viseral (avtonom): ixtiyorsiz","Hujayralar: neyronlar + neyrogliya"],
`<svg viewBox="0 0 400 260"><rect class="p" x="140" y="15" width="120" height="40" rx="12" fill="${N}"/><text x="200" y="41" fill="#fff" text-anchor="middle" font-weight="700">NERV S.</text><path id="l1" d="M200 55L90 130" stroke="${T}" stroke-width="3"/><path id="l2" d="M200 55L310 130" stroke="${P}" stroke-width="3"/><rect x="30" y="130" width="120" height="50" rx="12" fill="${T}"/><text x="90" y="160" fill="#fff" text-anchor="middle" font-weight="700">MNS</text><rect x="250" y="130" width="120" height="50" rx="12" fill="${P}"/><text x="310" y="160" fill="#fff" text-anchor="middle" font-weight="700">PNS</text>${sig('l1',2)}${sig('l2',2,G,7,1)}<text x="90" y="205" text-anchor="middle" font-size="12" fill="currentColor">miya + orqa miya</text><text x="310" y="205" text-anchor="middle" font-size="12" fill="currentColor">nervlar + gangliy</text></svg>`],
["II. Neyron komponentlari","",["Hujayra tanasi: MNS da yadro, PNS da gangliy","Dendritlar - kalta, ko'p shoxli: impuls tanaga","Akson - uzun, yagona: impuls tanadan olib ketadi","Signal dendritdan aksonga yuguradi"],
`<svg viewBox="0 0 400 260">${neu(100,130,P,'ax')}${sig('ax',2.2)}${sig('ax',2.2,O,7,1.1)}<text x="100" y="190" text-anchor="middle" font-size="12" fill="currentColor">tana</text><text x="50" y="60" text-anchor="middle" font-size="12" fill="currentColor">dendritlar</text><text x="260" y="118" font-size="12" fill="currentColor">akson →</text></svg>`],
["Neyronlar turlari","",["Unipolar: bitta o'simta, ikki tarmoq (sensor gangliylar)","Bipolar: 1 dendrit + 1 akson (ko'z, quloq, hid)","Multipolar: eng keng tarqalgan (orqa miya shoxlari, avtonom gangliylar)"],
`<svg viewBox="0 0 400 260"><path id="u" d="M20 50H150M150 50L200 30M150 50L200 70" stroke="${O}" stroke-width="4" fill="none"/><circle class="p" cx="100" cy="50" r="14" fill="${Y}" stroke="${O}" stroke-width="3"/>${sig('u',2.4)}<path id="b" d="M20 130L120 110L380 125" stroke="${T}" stroke-width="4" fill="none"/><circle class="p" cx="120" cy="110" r="14" fill="${Y}" stroke="${T}" stroke-width="3"/>${sig('b',2.4,O)}<path id="m" d="M120 210H380M120 210l-35-30M120 210l-40 20M120 210l-10-45" stroke="${P}" stroke-width="4" fill="none"/><circle class="p" cx="120" cy="210" r="16" fill="${Y}" stroke="${P}" stroke-width="3"/>${sig('m',2.4,Y,7,.8)}</svg>`],
["Mielin va sinaps","",["Mielin - akson atrofidagi yog'simon qoplama","PNS: Shvan hujayralari; MNS: oligodendrositlar","Sinaps: presinaptik → postsinaptik element","Signal mielin tugunlaridan sakrab o'tadi"],
`<svg viewBox="0 0 400 260"><path id="my" d="M10 100H270" stroke="${T}" stroke-width="7"/>${[30,90,150,210].map(x=>`<rect x="${x}" y="88" width="45" height="24" rx="10" fill="${Y}" stroke="${O}"/>`).join('')}${sig('my',2.4,P,7)}<circle cx="300" cy="100" r="22" fill="${O}"/><circle cx="360" cy="150" r="30" fill="${G}"/>${[0,1,2,3].map(i=>`<circle r="4" fill="${N}"><animate attributeName="cx" values="285;350" dur="1.4s" begin="${i*.35}s" repeatCount="indefinite"/><animate attributeName="cy" values="105;145" dur="1.4s" begin="${i*.35}s" repeatCount="indefinite"/></circle>`).join('')}<text x="300" y="140" text-anchor="middle" font-size="11" fill="currentColor">pre</text><text x="360" y="200" text-anchor="middle" font-size="11" fill="currentColor">post</text></svg>`],
["Bosh miya","",["Kalla suyagi ichida","Po'stloq = kulrang modda (neyron tanalari)","Ichida oq modda: aksonlar, yo'llar (traktlar)","Qorinchalarda serebrospinal suyuqlik"],
`<svg viewBox="0 0 400 260"><ellipse class="p" cx="200" cy="120" rx="130" ry="90" fill="#ffb3c6" stroke="${P}" stroke-width="5"/><ellipse cx="200" cy="120" rx="80" ry="50" fill="#fff"/><path d="M110 120Q150 60 200 110T290 100" stroke="${P}" stroke-width="4" fill="none" class="fd"/><path id="br" d="M120 150Q200 80 280 150" fill="none"/>${sig('br',1.8)}${sig('br',1.8,T,7,.9)}<text x="200" y="125" text-anchor="middle" font-weight="700" fill="${N}">OQ MODDA</text><text x="200" y="235" text-anchor="middle" fill="currentColor">Kulrang po'stloq</text></svg>`],
["Orqa miya","",["Umurtqa kanalining 2/3 qismida","Bo'yin va bel kengaymalari - qo'l va oyoqlar uchun","Markazda kulrang, atrofda oq modda","Konus medullaris: kattalarda L1-L2, chaqaloqlarda L3"],
`<svg viewBox="0 0 400 260"><rect x="170" y="10" width="60" height="230" rx="30" fill="#ffe0b8"/><rect x="185" y="25" width="30" height="200" rx="15" fill="${G}"/><path id="d1" d="M195 20V230" stroke="none"/><path id="d2" d="M205 230V20" stroke="none"/>${sig('d1',2.6,Y)}${sig('d1',2.6,Y,7,1.3)}${sig('d2',2.6,P,7,.6)}<text x="240" y="240" font-size="12" fill="currentColor">konus medullaris</text><text x="80" y="60" font-size="12" fill="currentColor">↓ motor</text><text x="80" y="90" font-size="12" fill="currentColor">↑ sensor</text></svg>`],
["Miya pardalari","",["Uch qavat: pia, araxnoid, dura mater","Araxnoid va pia orasi = subaraxnoidal bo'shliq","Serebrospinal suyuqlik shu yerda aylanadi","Tomir to'r chigallarida ishlab chiqariladi"],
`<svg viewBox="0 0 400 260"><circle cx="200" cy="130" r="115" fill="#ff8fab"/><circle cx="200" cy="130" r="95" fill="${Y}"/><circle cx="200" cy="130" r="80" fill="#9fe3ff"/><circle cx="200" cy="130" r="65" fill="#7fd6c2"/><circle class="p" cx="200" cy="130" r="45" fill="#ddd"/><text x="200" y="135" text-anchor="middle" font-weight="700" fill="${N}">MIYA</text>${[0,1,2,3,4].map(i=>`<circle class="dr" cx="${140+i*30}" cy="${60}" r="4" fill="#0077cc" style="animation-delay:${i*.4}s"/>`).join('')}<text x="200" y="255" text-anchor="middle" font-size="11" fill="currentColor">dura → araxnoid → pia</text></svg>`],
["Klinik: Tarqoq skleroz","",["Mielin qavatining yemirilishi","Immun sistema MNS mielinga hujum qiladi","Signal o'tishi buziladi: kuchsizlik, ko'rish va sezuvchanlik buzilishi","Ayollarda ko'proq"],
`<svg viewBox="0 0 400 260"><path id="ms" d="M10 130H390" stroke="${T}" stroke-width="7"/>${[20,120,220,310].map((x,i)=>`<rect class="fd" x="${x}" y="116" width="60" height="28" rx="10" fill="${Y}" stroke="${O}" style="animation-delay:${i*.6}s"/>`).join('')}${sig('ms',3,P,8)}<text x="200" y="200" text-anchor="middle" fill="currentColor" font-size="13">mielin yemirilyapti - signal sekinlashadi</text></svg>`],
["IV. Kranial nervlar","",["12 juft, ko'pi bosh miyadan","Harakat neyronlari MNS ichida, sensorlari gangliylarda","IV nerv (troxlear) - dorsaldan chiqadi"],
`<svg viewBox="0 0 400 260">${'I II III IV V VI VII VIII IX X XI XII'.split(' ').map((r,i)=>`<circle class="hb" style="--d:${1+i*.12}s" cx="${50+(i%6)*60}" cy="${80+Math.floor(i/6)*90}" r="24" fill="${[T,O,P,G,N,'#a45ee6'][i%6]}"/><text x="${50+(i%6)*60}" y="${86+Math.floor(i/6)*90}" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">${r}</text>`).join('')}</svg>`],
["Spinal nerv","",["31 juft: 8 bo'yin, 12 ko'krak, 5 bel, 5 dumg'aza, 1 dum","Orqa ildiz (sensor) + ventral ildiz (motor)","Dorsal va ventral birlamchi shoxlarga ajraladi","Sariq: sensor → MNS; pushti: motor → mushak"],
`<svg viewBox="0 0 400 260"><ellipse cx="50" cy="130" rx="40" ry="50" fill="${Y}"/><path id="af" d="M380 90L220 130L90 115" stroke="${T}" stroke-width="5" fill="none"/><path id="ef" d="M90 145L200 135L380 190" stroke="${P}" stroke-width="5" fill="none"/>${sig('af',2.4,Y)}${sig('af',2.4,Y,7,1.2)}${sig('ef',2.4,O,7,.6)}<text x="330" y="80" font-size="12" fill="currentColor">afferent</text><text x="320" y="215" font-size="12" fill="currentColor">efferent</text></svg>`],
["Simpatik: 'kurash yoki qoch'","",["Neyronlar T1-L2 lateral shoxida","Yurak urishi oshadi, bronxlar kengayadi","Hazm sekinlashadi, qorachiq kengayadi","Norepinefrin ajratadi"],
`<svg viewBox="0 0 400 260"><path class="hb" style="--d:.35s" fill="${P}" d="M200 220C60 130 90 40 150 55C180 62 200 90 200 90C200 90 220 62 250 55C310 40 340 130 200 220Z"/><text x="200" y="150" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">TEZ</text></svg>`],
["Parasimpatik: 'dam ol va hazm qil'","",["III, VII, IX, X kranial nervlar + S2-S4","Yurak urishi pasayadi, qorachiq torayadi","Peristaltika va sekretsiya oshadi","Atsetilxolin; anabolizm"],
`<svg viewBox="0 0 400 260"><path class="hb" style="--d:1.8s" fill="${T}" d="M200 220C60 130 90 40 150 55C180 62 200 90 200 90C200 90 220 62 250 55C310 40 340 130 200 220Z"/><text x="200" y="150" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">SEKIN</text></svg>`],
["Taqqoslash","",["Yurak: simpatik ↑ soni/kuchi; parasimpatik ↓","Bronxlar: kengayadi / torayadi","Hazm: sekinlashadi / kuchayadi","Jigar: glikogenoliz / glikogen sintezi","Siydik pufagi: sfinkter yopiladi / detruzor qisqaradi","Jinsiy: ejakulyatsiya / erektsiya"],
`<svg viewBox="0 0 400 260"><rect x="20" y="30" width="170" height="200" rx="16" fill="${P}"/><rect x="210" y="30" width="170" height="200" rx="16" fill="${T}"/><text x="105" y="60" text-anchor="middle" fill="#fff" font-weight="700">SIMPATIK</text><text x="295" y="60" text-anchor="middle" fill="#fff" font-weight="700">PARASIMP.</text><path class="hb" style="--d:.35s" fill="#fff" d="M105 190C50 150 60 110 85 115C100 118 105 130 105 130C105 130 110 118 125 115C150 110 160 150 105 190Z"/><path class="hb" style="--d:1.8s" fill="#fff" d="M295 190C240 150 250 110 275 115C290 118 295 130 295 130C295 130 300 118 315 115C340 110 350 150 295 190Z"/></svg>`]];
const A=document.getElementById('app');let i=0;
S.forEach(([t,,b,v],k)=>{const d=document.createElement('section');d.className='s';d.innerHTML=`<h1>${t}</h1><div class="w"><ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul>${v}</div>`;A.appendChild(d)});
function show(){[...A.children].forEach((e,k)=>e.classList.toggle('on',k==i));document.getElementById('ct').textContent=(i+1)+' / '+S.length}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));show()}
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});
let x0;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(d<0?1:-1)});
show();
</script></body></html>
